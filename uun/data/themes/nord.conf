# Nord-inspired palette
set -g @textual-base nord
set -g window-style "bg=#2e3440,fg=#d8dee9"
set -g status-style "bg=#3b4252,fg=#d8dee9"
set -g @status-key-style "bg=#88c0d0,fg=#2e3440"
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0"
set -g pane-border-lines single
set -g mode-style "bg=#434c5e,fg=#eceff4"
set -g message-style "bg=#272c36,fg=#e5e9f0"
set -g @title-style "fg=#81a1c1"
set -g @accent "#88c0d0"
set -g @eol-critical "#bf616a"
set -g @eol-warning  "#ebcb8b"
set -g @eol-ok       "#a3be8c"
set -g @eol-unknown  "#616e88"
