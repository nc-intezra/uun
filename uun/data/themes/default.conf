# uun default theme — tmux syntax. Copy to ~/.config/uun/themes/<name>.conf
# and select with `theme = "<name>"` in config.toml, --theme, or `t` in the TUI.

set -g @textual-base textual-dark       # any Textual built-in theme as a starting point
set -g window-style "bg=colour234,fg=colour252"
set -g status-style "bg=colour236,fg=colour250"
set -g @status-key-style "bg=colour39,fg=colour16"
set -g status-position bottom          # top | bottom (key bar)
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour39"
set -g pane-border-lines rounded       # single | double | heavy | rounded | simple
set -g mode-style "bg=colour24,fg=colour231"
set -g message-style "bg=colour233,fg=colour248"
set -g @title-style "fg=colour39"
set -g @accent colour39

# Upper-right clock: strftime format (like tmux status-right) and colours.
# Default is ISO 8601 date + 24h time; e.g. "%Y-%m-%dT%H:%M:%S%z" for strict ISO with offset.
set -g @clock-format "%Y-%m-%d %H:%M:%S"
set -g @clock-style "bg=colour39,fg=colour16"

set -g @eol-critical colour203
set -g @eol-warning  colour214
set -g @eol-ok       colour114
set -g @eol-unknown  colour244

# Key bindings work like tmux bind-key (actions: refresh update update-all
# refresh-eol copy next-theme toggle-log help quit)
# bind-key R refresh
# unbind-key q
