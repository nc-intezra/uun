# Minimal 16-colour theme for basic terminals / serial consoles
source-file default.conf
set -g @textual-base ansi-dark
set -g window-style "bg=black,fg=white"
set -g status-style "bg=white,fg=black"
set -g @status-key-style "bg=black,fg=brightwhite"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightwhite"
set -g pane-border-lines simple
set -g mode-style "bg=white,fg=black"
set -g @title-style "fg=brightwhite"
set -g @accent brightwhite
set -g @eol-critical brightred
set -g @eol-warning  brightyellow
set -g @eol-ok       brightgreen
set -g @eol-unknown  brightblack
