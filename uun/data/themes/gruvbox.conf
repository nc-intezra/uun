# Gruvbox dark, heavy borders, key bar on top (tmux status-position top)
set -g @textual-base gruvbox
set -g window-style "bg=#282828,fg=#ebdbb2"
set -g status-style "bg=#3c3836,fg=#a89984"
set -g @status-key-style "bg=#d79921,fg=#282828"
set -g status-position top
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"
set -g pane-border-lines heavy
set -g mode-style "bg=#504945,fg=#fbf1c7"
set -g message-style "bg=#1d2021,fg=#d5c4a1"
set -g @title-style "fg=#fabd2f"
set -g @accent "#d79921"
set -g @eol-critical "#fb4934"
set -g @eol-warning  "#fe8019"
set -g @eol-ok       "#b8bb26"
set -g @eol-unknown  "#928374"
