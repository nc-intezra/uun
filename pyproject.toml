[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uun"
version = "0.1.0"
description = "Universal update notifier: one TUI for apt/dnf/zypper/pacman/flatpak/snap/brew/pip/pipx/cargo/rustup/npm updates plus end-of-life tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
uun = "uun.__main__:main"

[tool.setuptools.packages.find]
include = ["uun*"]

[tool.setuptools.package-data]
uun = ["data/*.toml", "data/themes/*.conf"]
