[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uun"
version = "0.1.1"
description = "Universal update notifier: one TUI for apt/dnf/zypper/pacman/flatpak/snap/brew/pip/pipx/cargo/rustup/npm updates plus end-of-life tracking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2",
    "rich>=14.0",
    # transitive deps pinned to patched floors (security audit 2026-11, SECURITY.md)
    "pygments>=2.20.0",       # CVE-2022-40896 (5.5), CVE-2026-4539 (3.3)
    "markdown-it-py>=2.2.0",  # CVE-2023-26302 (5.5), CVE-2023-26303 (5.5)
]

[project.scripts]
uun = "uun.__main__:main"

[tool.setuptools.packages.find]
include = ["uun*"]

[tool.setuptools.package-data]
uun = ["data/*.toml", "data/themes/*.conf"]
