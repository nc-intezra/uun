name: release

# Builds .deb/.rpm/wheel/sdist for a release, install-tests them on the target
# distros, uploads them to the GitHub release for `tag` (draft or published)
# and, if asked, publishes it.
# The packaging recipe comes from the branch the workflow runs on; the
# released source comes from `ref` (or the existing tag), untouched.
# If the tag doesn't exist yet, publishing a draft creates it at `ref`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      ref:
        description: "Commit SHA to release (needed if the tag doesn't exist yet; must match it if it does)"
        required: false
        default: ""
      upload:
        description: "Upload artifacts to the release"
        type: boolean
        default: true
      publish:
        description: "Publish the release (creates the tag at ref if missing)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve commit to release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag: $TAG"; exit 1;; esac
          # gh prints the API error body to stdout on failure, so test the exit
          # status rather than the output (a missing tag is expected pre-publish)
          if ! tagsha=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
            tagsha=""
          fi
          if [ -n "$REF" ]; then
            sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
            if [ -n "$tagsha" ] && [ "$tagsha" != "$sha" ]; then
              echo "tag $TAG is at $tagsha, not $sha"; exit 1
            fi
          elif [ -n "$tagsha" ]; then
            sha=$tagsha
          else
            echo "tag $TAG doesn't exist yet: pass ref=<commit sha>"; exit 1
          fi
          echo "releasing $TAG from $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out packaging recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pkg
          persist-credentials: false
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          path: src
          persist-credentials: false
      - name: Verify tag matches project version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("src/pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != pyproject version $v"; exit 1; }
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q build pip-audit
      - name: Audit bundled dependencies
        run: |
          "$RUNNER_TEMP/venv/bin/pip-audit" -r pkg/packaging/requirements.lock --require-hashes --disable-pip
      - name: Build
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          SOURCE_DATE_EPOCH=$(git -C src log -1 --format=%ct) pkg/packaging/build.sh src dist
      - name: Inspect packages
        run: |
          dpkg-deb -I dist/*.deb
          rpm -qip dist/*.rpm
          rpm -qp --requires dist/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: pkg/.github/release-notes/
          if-no-files-found: ignore

  test:
    needs: build
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu runs on the GitHub-hosted Ubuntu VMs themselves: archive.ubuntu.com
          # doesn't resolve from containers on these runners (the VMs use a mirror).
          - { name: ubuntu-24.04,         image: host, runner: ubuntu-24.04,  platform: linux/amd64, kind: deb }
          - { name: debian-12,            image: "debian:12",                 platform: linux/amd64, kind: deb }
          - { name: debian-13,            image: "debian:13",                 platform: linux/amd64, kind: deb }
          - { name: raspberry-pi-arm64,   image: "debian:12",                 platform: linux/arm64, kind: deb }
          - { name: raspberry-pi-armhf,   image: "debian:12",                 platform: linux/arm/v7, kind: deb }
          - { name: rocky-9,              image: "rockylinux/rockylinux:9",   platform: linux/amd64, kind: rpm-dnf }
          - { name: almalinux-9,          image: "almalinux:9",               platform: linux/amd64, kind: rpm-dnf }
          - { name: fedora,               image: "fedora:latest",             platform: linux/amd64, kind: rpm-dnf }
          - { name: opensuse-leap-15.6,   image: "opensuse/leap:15.6",        platform: linux/amd64, kind: rpm-zypper }
          # informational: Python 3.10 by default; passes only if python3.11 is installable
          - { name: ubuntu-22.04,         image: host, runner: ubuntu-22.04,  platform: linux/amd64, kind: deb, optional: true }
    continue-on-error: ${{ matrix.optional == true }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Install-test on ${{ matrix.name }} (${{ matrix.platform }})
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          KIND: ${{ matrix.kind }}
        run: |
          case "$KIND" in deb) f=$(ls dist/*.deb);; *) f=$(ls dist/*.rpm);; esac
          if [ "$IMAGE" = host ]; then
            sudo sh packaging/ci/smoke.sh "$KIND" "$PWD/$f"
          else
            docker run --rm --platform "$PLATFORM" -v "$PWD:/w:ro" "$IMAGE" \
              sh /w/packaging/ci/smoke.sh "$KIND" "/w/$f"
          fi

  upload:
    needs: [build, test]
    if: inputs.upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true   # notes are optional
        with:
          name: notes
          path: notes
      - name: Upload to the release for ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.build.outputs.sha }}
          REPO: ${{ github.repository }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS)
          id=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$REPO/releases" -f tag_name="$TAG" -f target_commitish="$SHA" \
                 -f name="uun $TAG" -F draft=true --jq .id)
          fi
          draft=$(gh api "repos/$REPO/releases/$id" --jq .draft)
          args=(-f name="uun $TAG")
          [ "$draft" = true ] && args+=(-f target_commitish="$SHA")
          [ -f "notes/$TAG.md" ] && args+=(-F "body=@notes/$TAG.md")
          gh api -X PATCH "repos/$REPO/releases/$id" "${args[@]}" --jq '"release " + .name + " -> " + .target_commitish'
          for f in dist/*; do
            name=$(basename "$f")
            old=$(gh api "repos/$REPO/releases/$id/assets" --jq ".[] | select(.name == \"$name\") | .id")
            [ -z "$old" ] || gh api -X DELETE "repos/$REPO/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq '.name + "  " + (.size|tostring)'
          done
          if [ "$PUBLISH" = true ]; then
            gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -f make_latest=true \
              --jq '"published " + .html_url'
            tagsha=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
            [ "$tagsha" = "$SHA" ] || { echo "tag $TAG points at $tagsha, expected $SHA"; exit 1; }
          fi
